# Questions for scripts/geo-meritve.mjs: how often AI assistants with web search cite ej-aj.si.
# Written the way a Slovenian user would type them into ChatGPT, Claude, Gemini or Perplexity.
# Keep the list stable between runs, otherwise the monthly numbers can't be compared; add new
# questions at the end and remove a question only when its page is gone.
#
# id: short and stable (results are compared by id)
# vprasanje: the question as a user would ask it
# cilj: the page on ej-aj.si that answers it (to see whether the right page gets cited)

