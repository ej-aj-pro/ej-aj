  preverjeno: 2026-10-17

- id: slaif
  naziv: SLAIF, slovenska tovarna umetne inteligence
  izvajalec: Konzorcij, ki ga vodi IZUM, z univerzami, IJS, Arnesom, GZS in Tehnološkim parkom Ljubljana (sofinancirata EuroHPC in Slovenija)
  vrsta: storitev
  status: napovedan
  kdo: Podjetja, tudi mala in srednja ter zagonska, javne ustanove in raziskovalci.
  kaj: >-
    Načrtovane storitve: svetovanje, dostop do superračunalnikov, vnaprej naučeni modeli in
    podatkovni nabori, oblačne AI storitve, usposabljanja in hekatoni.
  sredstva: >-
    Projekt storitev tovarne je vreden 11.680.000 EUR (brez superračunalnika). Ali bo dostop za
    podjetja brezplačen, na straneh projekta ni navedeno.
  rok: >-
    Projekt traja od 1. septembra 2025 do 31. avgusta 2028. Javnega poziva za dostop še ni, SLING
    podjetjem svetuje, naj povpraševanje za vire in storitve SLAIF pošljejo na podpora@sling.si.
  ai: Da, projekt je namenjen AI.
  opomba: Do takrat podjetja dostop do superračunalnika Vega dobijo prek SLING (glejte spodaj).
  vir: https://www.sling.si/slaif/
  viri:
    - https://www.tp-lj.si/en/projects/slaif-the-slovenian-artificial-intelligence-factory-2025-11-18
    - https://www.sling.si/podpora/za-industrijo/
  preverjeno: 2026-10-17

# Podpora brez roka

- id: edih-digi-si
  naziv: EDIH DIGI-SI 2.0, evropsko digitalno inovacijsko stičišče
  izvajalec: Konzorcij, ki ga vodi Digitalno inovacijsko stičišče Slovenije (program Digitalna Evropa)
  vrsta: storitev
  status: stalno
  kdo: Mala in srednja podjetja, zagonska podjetja in organizacije javnega sektorja v Sloveniji.
  kaj: >-
    Preizkus pred naložbo (dostop do AI infrastrukture, testno okolje za AI agente), ocena
    digitalne zrelosti, načrt digitalne preobrazbe, delavnice, svetovanje glede Akta o umetni
    inteligenci in pomoč pri iskanju financiranja.
  sredstva: >-
    Cene storitev na strani niso navedene. Projekt je vreden 2.836.999,07 EUR, polovico krije EU,
    do polovice Ministrstvo za notranje zadeve in javno upravo.
  rok: Brez roka. Projekt traja od 1. aprila 2026 do 31. marca 2029.
  ai: Da, več storitev je namenjenih AI.
  vir: https://digi-si.eu/storitve
  viri:
    - https://digi-si.eu/o-nas
  preverjeno: 2026-10-17

- id: src-edih
  naziv: SRC-EDIH 2.0, evropsko digitalno inovacijsko stičišče
  izvajalec: Razvojni center Novo mesto s partnerji
  vrsta: storitev
  status: stalno
  kdo: Mikro, mala in srednja podjetja, predvsem proizvodna.
  kaj: >-
    Preizkus poslovne ideje v testnih okoljih z AI rešitvami, usposabljanja, svetovanje glede
    Akta o umetni inteligenci in pomoč pri prijavah na razpise.
  sredstva: Po navedbah stičišča so storitve za mala in srednja podjetja brezplačne.
  rok: Brez roka.
  ai: Da, AI je eno glavnih področij stičišča.
  vir: https://src-edih.si/storitve/testiranje
  viri:
    - https://src-edih.si/pomoc
    - https://src-edih.si/o-projektu
  preverjeno: 2026-10-17

- id: eurohpc-ai-factories
  naziv: 'EuroHPC AI Factories: dostop do grafičnih procesorjev za AI'
  izvajalec: Skupno podjetje EuroHPC (EU)
  vrsta: poziv
  status: stalno
  kdo: >-
    Podjetja, tudi mala in srednja ter zagonska. Raziskovalci in javni sektor imajo svoj način
    dostopa.
  kaj: >-
    Računalniški čas na evropskih superračunalnikih za učenje in preizkušanje AI modelov. Za
    začetnike dostop za 1 do 3 mesece v dveh delovnih dneh, za srednje potrebe do 50.000 ur
    grafičnih procesorjev, za večje projekte več.
  sredstva: Za AI mala in srednja podjetja ter zagonska podjetja je dostop brezplačen.
  rok: >-
    Manjši dostop brez roka, vloge se obravnavajo po vrstnem redu. Za več kot 50.000 ur sta roka
    dvakrat na mesec, odobritev pride v 10 delovnih dneh po roku.
  ai: Da, dostop je namenjen AI.
  vir: https://www.eurohpc-ju.europa.eu/ai-factories/ai-factories-access-modes_en
  viri:
    - https://www.eurohpc-ju.europa.eu/playground-access-ai-factories_en
    - https://www.eurohpc-ju.europa.eu/ai-factories/ai-factories-access-modes/fast-lane-access-ai-factories_en
    - https://www.eurohpc-ju.europa.eu/large-scale-access-ai-factories_en
  preverjeno: 2026-10-17

- id: sling-vega
  naziv: Pilotni dostop za gospodarstvo do superračunalnika Vega
  izvajalec: SLING, slovenska superračunalniška mreža
  vrsta: storitev
  status: stalno
  kdo: Podjetja, ki želijo preizkusiti superračunalnik.
  kaj: >-
    Pilotni dostop do superračunalnika Vega, ocena pripravljenosti podjetja na superračunalništvo,
    usposabljanja ter za izbrana mala in srednja podjetja pomoč pri prijavah na razpise.
  sredstva: >-
    Pilotni dostop do 2.000 ur procesorskih ali 400 ur grafičnih vozlišč. Ocena pripravljenosti in
    usposabljanja so brezplačni, za pilotni dostop stran cene ne navaja.
  rok: Brez roka.
  ai: Delno. SLING omenja rabo superračunalnika za AI in podjetja usmerja tudi k virom in storitvam SLAIF.
  vir: https://www.sling.si/podpora/za-industrijo/
  viri:
    - https://www.sling.si/razpisi-za-odprti-dostop-in-rabo-virov/
  preverjeno: 2026-10-17

# Nedavno zaprto

- id: srips-koc-2026-2029
  naziv: Kompetenčni centri za razvoj kadrov (KOC 2026 do 2029)
  izvajalec: Javni štipendijski, razvojni, invalidski in preživninski sklad RS
  vrsta: razpis
  status: zaprt
  kdo: >-
    Partnerstvo vsaj 15 mikro, malih in srednjih podjetij, eno od njih je prijavitelj. Posamezno
    podjetje se ni moglo prijaviti samo.
  kaj: >-
    Usposabljanje zaposlenih v malih in srednjih podjetjih. Najmanj 20 % usposabljanj mora biti
    za digitalne ali zelene kompetence.
  sredstva: >-
    Skupaj 14.577.560 EUR za 20 centrov, največ 728.878 EUR na partnerstvo. Pri usposabljanjih
    50 % stroškov, za srednja podjetja do 60 %, za mikro in mala do 70 %.
  rok: 18. september 2026 (rok je bil podaljšan s 3. septembra). Izbor še ni objavljen.
  rok_datum: 2026-09-18
  ai: Ne. Razpis omenja digitalne kompetence, AI posebej ne.
  vir: https://www.srips-rs.si/vsi-razpisi/razpis/jr-koc-2026-2029
  preverjeno: 2026-10-17

- id: aris-inovacijski-vavcerji-2026
  naziv: Inovacijski vavčerji 2026
  izvajalec: ARIS
  vrsta: vavcer
  status: zaprt
  kdo: >-
    Mikro, mala in srednja podjetja, registrirana kot gospodarske družbe, ki za razvoj naročijo
    storitve pri javno financiranih raziskovalnih organizacijah.
  kaj: >-
    Raziskovalne in razvojne storitve za nov ali izboljšan izdelek, proces ali storitev, na
    primer meritve, preizkusi, analize, modeliranje in simulacije.
  sredstva: >-
    Do 50 % upravičenih stroškov, od 10.000 do 25.000 EUR na vavčer. Skupaj 1.000.000 EUR.
  rok: 10. junij in 10. september 2026
  rok_datum: 2026-09-10
  ai: Ne, AI ni omenjen. Vavčer pa lahko pokrije storitve raziskovalne organizacije tudi pri razvoju AI rešitve.
  vir: https://www.aris-rs.si/objave/razpisi/javni-razpis-inovacijski-vavcerji-2026-kratica-javnega-poziva-jr-vavcerji-2026-05-12
  preverjeno: 2026-10-17

- id: jr-ddk-2026-2028
