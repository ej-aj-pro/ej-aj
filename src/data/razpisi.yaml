  naslov: 'Digitalna Evropa: kibernetska varnost MSP z rešitvami na podlagi AI'
  razpisovalec: Evropska komisija, Evropski center za kibernetsko varnost (ECCC)
  raven: eu
  stanje: odprt
  za_koga: Organizacije, ki malim in srednjim podjetjem ponudijo AI orodja in storitve za kibernetsko varnost. Pogoje za prijavitelje preverite v dokumentaciji razpisa.
  kaj: Uvajanje AI orodij, s katerimi se MSP pripravijo na kibernetske napade, se pred njimi zaščitijo in se nanje odzovejo, tudi usposabljanje zaposlenih.
