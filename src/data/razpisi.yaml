# Javna sredstva in brezplačna podpora za AI v Sloveniji (stran /razpisi/).
# Vsako dejstvo je s strani izvajalca (vir, viri): gov.si, podjetniskisklad.si, aris-rs.si,
# srips-rs.si, Uradni list, europa.eu ali stran evropskega projekta. Nič iz novic, svetovalcev ali
# spomina. Mesečno preverjanje: skill posodobi-modele, korak 2d. Zaprte razpise odstranimo približno
# štiri mesece po roku. rok_datum je zadnji rok; po njem stran vnos sama pokaže kot zaprt.

# Odprto

- id: aris-crp-2026
  naziv: Ciljni raziskovalni program CRP 2026
  izvajalec: ARIS (skupaj z ministrstvi)
  vrsta: razpis
  status: odprt
  kdo: >-
    Raziskovalne organizacije in zasebni raziskovalci, vpisani pri ARIS. Vodja projekta mora imeti
    doktorat. Podjetje lahko sodeluje le, če je vpisano v evidenco raziskovalnih organizacij pri
    ARIS.
  kaj: >-
    Raziskovalni projekti na teme, ki jih potrebujejo ministrstva in drugi organi. Med njimi so
    tudi teme o umetni inteligenci.
  sredstva: Skupaj okvirno 5.431.100 EUR za vse teme.
  rok: 17. november 2026 do 14.00
  rok_datum: 2026-11-17
  ai: >-
    Da, pri nekaterih temah, na primer varstvo avtorskih pravic in osebnih podatkov pri velikih
    jezikovnih modelih, smernice za njihovo rabo v javni upravi in asistent z velikim jezikovnim
    modelom za podatke Geodetske uprave. Večina tem ni o AI.
  vir: https://www.aris-rs.si/objave/razpisi/javni-razpis-za-izbiro-raziskovalnih-projektov-ciljnega-raziskovalnega-programa-crp-2026-v-letu-2026-2026-10-16
  preverjeno: 2026-10-17

- id: eic-accelerator
  naziv: EIC Accelerator
  izvajalec: Evropski svet za inovacije (Evropska komisija)
  vrsta: razpis
  status: odprt
  kdo: >-
    Posamezna zagonska ter mala in srednja podjetja iz EU ali držav, pridruženih programu Obzorje
    Evropa, tudi posamezniki, ki šele ustanavljajo podjetje. Nekoliko večja podjetja (do 499
    zaposlenih) lahko zaprosijo le za naložbo v kapital.
  kaj: >-
    Razvoj inovacije do trga, ko je izdelek že preizkušen v okolju, podobnem resničnemu. Najprej
    oddate kratko prijavo, šele po njeni odobritvi polno prijavo.
  sredstva: >-
    Nepovratna sredstva do 2,5 milijona EUR, naložba v kapital od 1 do 10 milijonov EUR ali
    oboje skupaj.
  rok: >-
    Kratka prijava kadar koli. Naslednji rok za polno prijavo je 4. november 2026, za leto 2027 roki
    še niso objavljeni.
  ai: Ni posebej omenjen. Razpis je odprt za vsa področja, tudi za AI.
  vir: https://eic.ec.europa.eu/eic-funding-opportunities/eic-accelerator_en
  preverjeno: 2026-10-17

- id: digitalna-evropa-ai4sme
  naziv: 'Digitalna Evropa: kibernetska varnost malih in srednjih podjetij z AI (CYBER-11-AI4SME)'
  izvajalec: Evropski kompetenčni center za kibernetsko varnost (ECCC), program Digitalna Evropa
  vrsta: razpis
  status: odprt
  kdo: >-
    Pravne osebe iz EU ali Evropskega gospodarskega prostora (EGP), ki razvijajo ali uvajajo AI
    orodja za kibernetsko varnost malih in srednjih podjetij. Prijavi se lahko posamezna
    organizacija ali konzorcij. Organizacije ne smejo biti pod nadzorom iz držav zunaj EU in EGP.
  kaj: >-
    Razvoj in uvedba AI orodij, s katerimi mala in srednja podjetja obvladujejo tveganja, zaznajo
    napade, se nanje odzovejo in o njih poročajo.
  sredstva: Za to temo skupaj 20 milijonov EUR.
  rok: 14. januar 2027 do 17.00 po bruseljskem času
  rok_datum: 2027-01-14
  ai: Da, AI je jedro razpisa.
  vir: https://cybersecurity-centre.europa.eu/news/new-eccc-call-proposals-under-digital-europe-programme-open-applications-2026-09-01_en
  viri:
    - https://cybersecurity-centre.europa.eu/document/8e1d6074-95ed-4b23-8bd3-2ca42b096411_en
    - https://digital-strategy.ec.europa.eu/en/funding/call-proposals-strengthening-cybersecurity-capacities-european-smes-cybersecure-ai-powered
  preverjeno: 2026-10-17

# Napovedano

- id: aris-ai-manjsi-projekti
  naziv: Podpora aplikativnim projektom manjših vrednosti na področju umetne inteligence
  izvajalec: ARIS in Ministrstvo za notranje zadeve in javno upravo (prej Ministrstvo za digitalno preobrazbo)
  vrsta: razpis
  status: napovedan
  kdo: >-
    Po programu ukrepov ministrstva mikro, mala in srednja ter zagonska podjetja. Program dela ARIS
    ciljno skupino opisuje širše (tudi večja podjetja, ki sodelujejo z raziskovalnimi
    organizacijami), zato pogoje preverite ob objavi.
  kaj: >-
    AI rešitve v dveh korakih: najprej preizkus in prvi delujoči prototip, nato vključitev v
    poslovne procese in preizkus v praksi.
  sredstva: >-
    Za obdobje 2026 do 2030 do 6,4 milijona EUR. Po programu ukrepov je sofinanciranje od 35 do
    100 % upravičenih stroškov, odvisno od aktivnosti in vrste organizacije.
  rok: Objava je predvidena v zadnjem četrtletju 2026.
  ai: Da, razpis je namenjen samo AI.
  opomba: >-
    Zneski in pogoji so iz načrtovalnih dokumentov ministrstva in ARIS. V objavljenem razpisu se
    lahko spremenijo.
  vir: https://www.aris-rs.si/objave/razpisi/podpora-aplikativnim-projektom-manjsih-vrednosti-na-podrocju-umetne-inteligence-2026-12-31
  viri:
    - https://www.gov.si/assets/ministrstva/MNZJU/MDP/DDD/DDD-dokumenti/Program-ukrepov-spodbujanja-podjetnistva-MDP/Dopolnjen_program_ukrepov_MDP-V9_050126.pdf
    - https://www.aris-rs.si/uploads/sl/finan/inc/PDFN2026_ARIS.pdf
  preverjeno: 2026-10-17

- id: aris-ai-inovacijski-projekti
  naziv: Podpora inovacijskim projektom s področja umetne inteligence
  izvajalec: ARIS in Ministrstvo za notranje zadeve in javno upravo (prej Ministrstvo za digitalno preobrazbo)
  vrsta: razpis
  status: napovedan
  kdo: >-
    Po programu ukrepov ministrstva srednja in velika podjetja v konzorcijih z drugimi podjetji in
    raziskovalnimi organizacijami. Upravičenke so lahko tudi raziskovalne organizacije.
  kaj: >-
    Uvajanje AI v poslovanje pri rešitvah, ki so že blizu uporabe, na primer na področjih
    energetike, okolja, kmetijstva, prometa, zdravstva in pametnih tovarn. Najprej preizkus, nato
    izvedba.
  sredstva: >-
    Do 16.256.405,36 EUR iz programa evropske kohezijske politike za obdobje 2026 do 2029. Sofinanciranje do
    60 % upravičenih stroškov, odvisno od vrste pomoči in regije.
  rok: >-
    Objava je predvidena v zadnjem četrtletju 2026 (v programu dela ARIS iz marca 2026 je bila
    načrtovana za drugo četrtletje).
  ai: Da, razpis je namenjen samo AI.
  opomba: >-
    Zneski in pogoji so iz načrtovalnih dokumentov ministrstva in ARIS. V objavljenem razpisu se
    lahko spremenijo.
  vir: https://www.aris-rs.si/objave/razpisi/podpora-inovacijskim-projektom-s-podrocja-umetne-inteligence-2026-12-31
  viri:
    - https://www.gov.si/assets/ministrstva/MNZJU/MDP/DDD/DDD-dokumenti/Program-ukrepov-spodbujanja-podjetnistva-MDP/Dopolnjen_program_ukrepov_MDP-V9_050126.pdf
    - https://www.aris-rs.si/uploads/sl/finan/inc/PDFN2026_ARIS.pdf
  preverjeno: 2026-10-17

- id: mk-digitalizacija-slovenscine
  naziv: Digitalizacija slovenščine
  izvajalec: Ministrstvo za kulturo
  vrsta: razpis
  status: napovedan
  kdo: >-
    Raziskovalne organizacije in javni zavodi s področja kulture. Podjetja kot prijavitelji niso
    navedena.
  kaj: >-
    Jezikovne tehnologije ter podatkovni in jezikovni viri za slovenščino, ki podpirajo razvoj in
    rabo AI v slovenskem jeziku.
  sredstva: 3.700.000 EUR, od tega 2.345.800 EUR iz EU.
  rok: >-
    Ministrstvo je objavo napovedalo za september 2026 (portal evropskasredstva.si navaja 30. april
    2026). Do dneva preverjanja razpis ni bil objavljen.
  ai: Da, razpis podpira razvoj in rabo AI za slovenščino.
  vir: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-kulturo/javne-objave/napoved-predvidenih-javnih-razpisov-in-pozivov-ministrstva-za-kulturo
  viri:
    - https://evropskasredstva.si/razpisi/napovedan
  preverjeno: 2026-10-17

- id: sps-v11-kibernetska-varnost
  naziv: Vavčer za kibernetsko varnost (V11)
  izvajalec: Slovenski podjetniški sklad
  vrsta: vavcer
  status: napovedan
  kdo: Po načrtu objav sklad vse spodbude v letu 2026 namenja mikro, malim in srednjim podjetjem.
  kaj: Stroški za boljšo kibernetsko varnost podjetja.
  sredstva: Do 9.999,99 EUR na podjetje, skupaj 2,5 milijona EUR.
  rok: Objava je predvidena v drugi polovici leta 2026. Sklad si pridržuje pravico do spremembe.
  ai: Ne, vavčer je za kibernetsko varnost. Navajamo ga, ker je edini napovedani digitalni vavčer sklada.
