# Razpisi za AI, digitalizacijo in tehnologijo za /razpisi/. Vsak podatek mora biti razviden iz
# strani v "viri" (prva povezava je uradna objava razpisa, nanjo vodi gumb na strani).
# stanje: odprt (prijave so mogoče), napovedan (razpisovalec ga je napovedal, objavljen še ni),
# zaprt (rok je potekel; ostane na strani do 12 mesecev kot orientacija za naslednje leto).
# Status vedno preverimo na strani razpisa, ne na seznamu razpisovalca. Osvežuje ga skill
# posodobi-razpise vsak teden.

