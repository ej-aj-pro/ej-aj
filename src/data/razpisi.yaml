- id: eic-women-techeu-2
  naslov: 'Women TechEU 2: podpora startupom, ki jih vodijo ženske'
  razpisovalec: Konzorcij projekta Women TechEU 2 EIC, financira Evropski svet za inovacije (EIC) iz programa Obzorje Evropa
  raven: eu
  stanje: odprt
  za_koga: Mlada podjetja (startupi), ki ustrezajo opredelitvi malega ali srednjega podjetja (MSP) in so samostojna, s sedežem v EU ali v državi, pridruženi programu Obzorje Evropa, ki je upravičena do tega razpisa. Delovati morajo v enem od sektorjev deep tech, naštetih v smernicah za prijavitelje. Ob presečnem datumu, za katerega oddate obrazec, je podjetje registrirano vsaj šest mesecev in največ pet let. Podjetje je zbralo manj kot 1 milijon EUR lastniškega kapitala in še nima minimalnega delujočega izdelka (tehnologija je na stopnji 4 do 6 na lestvici tehnološke zrelosti TRL). Ob oddaji obrazca je soustanoviteljica na vodilnem položaju (CEO, CTO, CSO ali podobno), ženske imajo vsaj 25 % deležev. Prijavitelj ne sme biti v nasprotju interesov s partnerji konzorcija Women TechEU 2 EIC. Prijava ni mogoča za projekte, ki so že dobili sredstva Women TechEU ali EIC Accelerator. Prijava je v angleščini.
  kaj: Nepovratna sredstva in šestmesečni program podpore (mentorice, priprava na vlagatelje in izvoz, prodajna strategija). Najprej oddate obrazec za preverjanje upravičenosti (odprt do 13. 7. 2027 do 17. ure, presečni datum je vsak torek ob 17. uri, odgovor prejmete v enem tednu), upravičene startupe nato povabijo k polni prijavi. Če potrdilo o upravičenosti prejmete več kot 15 dni pred naslednjim rokom, morate polno prijavo oddati v tem roku. V vsakem roku je 40 % sredstev rezerviranih za startupe iz t. i. območij Widening.
  znesek: 75.000 EUR na startup, v vsakem roku 3 milijone EUR za 40 startupov (skupaj 12 milijonov EUR v štirih rokih, prvi je že potekel)
  rok: 2027-01-14
  rok_opis: naslednji rok za polno prijavo (do 17. ure), nato 1. 4. in 8. 7. 2027
  teme: [startup, raziskave]
  viri:
    - https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/competitive-calls-cs/48106227
  preverjeno: 2026-10-26

